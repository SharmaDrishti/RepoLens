[project]
name = "repolens"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
writer = ["anthropic"]
imports = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tomli; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
